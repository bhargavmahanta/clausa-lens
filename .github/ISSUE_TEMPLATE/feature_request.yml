name: Feature request
description: Propose a focused improvement to CausaLens
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture and normalization
        - Incident detection
        - Replay Capsule
        - Replay isolation
        - Interventions and differential analysis
        - System Packs
        - Command Center
        - Developer experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What observable result would demonstrate that this is complete?
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and trade-offs
      description: Note security, compatibility, determinism, operational, or scope concerns.

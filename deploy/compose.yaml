# CausaLens P0 orchestration (Member 2 owned path).
# Stack (frozen): PostgreSQL 15.18, Go 1.26.7 services, Docker Compose.
#
# Two deployment networks:
#   default  - the original (capture) system: demo gateway/checkout/payment/ledger
#              emit canonical events to the Core API; used for E1 capture.
#   replay   - INTERNAL (default-deny, no public/production egress). The replay
#              worker attaches only here. Replay execution is in-process against
#              replay-only in-memory state (the checked-out System Pack services),
#              so it reaches no production or public destination.
#
# The worker selects the System Pack via PACK_IMPL, and Core API does the same,
# both resolving checkout_duplicate_effect in their own registration seam.
services:
  postgres:
    image: postgres:15.18
    environment:
      POSTGRES_USER: causalens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-causalens}
      POSTGRES_DB: causalens
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causalens -d causalens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - causalens_pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - default

  core-api:
    build:
      context: ..
      dockerfile: cmd/core-api/Dockerfile
    environment:
      DATABASE_URL: postgres://causalens:${POSTGRES_PASSWORD:-causalens}@postgres:5432/causalens?sslmode=disable
      PACK_IMPL: ${PACK_IMPL:-checkout_duplicate_effect}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - default

  # Demo capture system (Member 1 services). Images are provided by Member 1's
  # build; they emit canonical events to the Core API. These are the original
  # (captured) execution, not the replay boundary.
  demo-gateway:
    image: ${GATEWAY_IMAGE:-causalens/demo-gateway:dev}
    environment:
      PORT: "8080"
      CHECKOUT_URL: http://demo-checkout:8081
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    depends_on:
      core-api:
        condition: service_started
    networks:
      - default

  demo-checkout:
    image: ${CHECKOUT_IMAGE:-causalens/demo-checkout:dev}
    environment:
      PORT: "8081"
      PAYMENT_URL: http://demo-payment:8082
      LEDGER_URL: http://demo-ledger:8083
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    networks:
      - default

  demo-payment:
    image: ${PAYMENT_IMAGE:-causalens/demo-payment:dev}
    environment:
      PORT: "8082"
      PAYMENT_LATENCY_MS: ${PAYMENT_LATENCY_MS:-350}
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    networks:
      - default

  demo-ledger:
    image: ${LEDGER_IMAGE:-causalens/demo-ledger:dev}
    environment:
      PORT: "8083"
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    networks:
      - default

  # Replay worker: drives ReplayRuns to terminal states. It is attached only to
  # the internal replay network (no production or public egress). It executes
  # replays in-process using the checked-out System Pack services against
  # replay-only in-memory state. PACK_IMPL resolves the same pack as Core API.
  replay-worker:
    build:
      context: ..
      dockerfile: cmd/replay-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://causalens:${POSTGRES_PASSWORD:-causalens}@postgres:5432/causalens?sslmode=disable
      PACK_IMPL: ${PACK_IMPL:-checkout_duplicate_effect}
      REPLAY_LEASE: ${REPLAY_LEASE:-5m}
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_started
    networks:
      - replay

networks:
  default: {}
  # Isolated replay-only network. An internal network has no route to the host
  # or public internet; only the worker is attached, so replay can never reach
  # production or uncontrolled destinations.
  replay:
    internal: true

volumes:
  causalens_pgdata:

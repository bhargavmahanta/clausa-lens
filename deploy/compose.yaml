# CausaLens P0 orchestration (Member 2 owned path).
# Stack (frozen): PostgreSQL 15.18, Go 1.26.7 services, Docker Compose.
#
# Three deployment networks:
#   default  - the original (capture) system: demo gateway/checkout/payment/ledger
#              emit canonical events to the Core API; used for E1 capture.
#   db       - INTERNAL: PostgreSQL plus every component that needs it
#              (core-api, replay-worker). The replay worker reaches PostgreSQL
#              here WITHOUT joining the capture/default network, so it has no
#              capture or public-network access.
#   replay   - INTERNAL (default-deny, no public/production egress). The replay
#              worker attaches here as the replay boundary. Replay execution is
#              in-process against replay-only in-memory state, so it reaches no
#              production or public destination.
#
# The Core API and the worker each select the System Pack via PACK_IMPL, both
# resolving checkout_duplicate_effect in their own registration seam.
services:
  postgres:
    image: postgres:15.18
    environment:
      POSTGRES_USER: causalens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-causalens}
      POSTGRES_DB: causalens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causalens -d causalens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - causalens_pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - db

  core-api:
    build:
      context: ..
      dockerfile: cmd/core-api/Dockerfile
    environment:
      DATABASE_URL: postgres://causalens:${POSTGRES_PASSWORD:-causalens}@postgres:5432/causalens?sslmode=disable
      PACK_IMPL: ${PACK_IMPL:-checkout_duplicate_effect}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - default
      - db

  command-center:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      CAUSALENS_CORE_API_URL: http://core-api:8080
      CAUSALENS_GATEWAY_URL: http://demo-gateway:8080
    depends_on:
      core-api:
        condition: service_started
      demo-gateway:
        condition: service_started
    ports:
      - "${COMMAND_CENTER_PORT:-3000}:3000"
    networks:
      - default

  # Demo capture system (Member 1 services). Images are provided by Member 1's
  # build; they emit canonical events to the Core API. These are the original
  # (captured) execution, not the replay boundary. demo-gateway is exposed to the
  # host so the golden checkout can be triggered with a plain POST (no hidden
  # commands).
  demo-gateway:
    image: ${GATEWAY_IMAGE:-causalens/demo-gateway:dev}
    environment:
      PORT: "8080"
      CHECKOUT_URL: http://demo-checkout:8081
      PAYMENT_URL: http://demo-payment:8082
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    ports:
      - "${GATEWAY_PORT:-18080}:8080"
    depends_on:
      core-api:
        condition: service_started
    networks:
      - default

  demo-checkout:
    image: ${CHECKOUT_IMAGE:-causalens/demo-checkout:dev}
    environment:
      PORT: "8081"
      PAYMENT_URL: http://demo-payment:8082
      LEDGER_URL: http://demo-ledger:8083
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    networks:
      - default

  demo-payment:
    image: ${PAYMENT_IMAGE:-causalens/demo-payment:dev}
    environment:
      PORT: "8082"
      PAYMENT_LATENCY_MS: ${PAYMENT_LATENCY_MS:-350}
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    networks:
      - default

  demo-ledger:
    image: ${LEDGER_IMAGE:-causalens/demo-ledger:dev}
    environment:
      PORT: "8083"
      CORE_API_EVENTS_URL: http://core-api:8080/v1/events
    networks:
      - default

  # Replay worker: drives ReplayRuns to terminal states. It reaches PostgreSQL
  # only through the internal db network and is never on the capture/default
  # network, so it has no capture or public-network access. Replay execution is
  # in-process against replay-only in-memory state. REPLAY_LEASE is consumed as
  # the orphan-claim lease (default 5m).
  replay-worker:
    build:
      context: ..
      dockerfile: cmd/replay-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://causalens:${POSTGRES_PASSWORD:-causalens}@postgres:5432/causalens?sslmode=disable
      PACK_IMPL: ${PACK_IMPL:-checkout_duplicate_effect}
      REPLAY_LEASE: ${REPLAY_LEASE:-5m}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
      - replay

networks:
  default: {}
  # Internal: PostgreSQL plus its consumers. No host/public route.
  db:
    internal: true
  # Isolated replay-only network. An internal network has no route to the host
  # or public internet; only the worker is attached, so replay can never reach
  # production or uncontrolled destinations.
  replay:
    internal: true

volumes:
  causalens_pgdata:
